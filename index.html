<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini Chatbot (3.5 Flash)</title>
  <style>
    :root {
      --bg: #f3f4f6;
      --surface: #ffffff;
      --border: #e5e7eb;
      --text: #111827;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --danger: #ef4444;
      --user-bubble: #2563eb;
      --model-bubble: #f3f4f6;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .chat-container {
      background: var(--surface);
      width: 100%;
      max-width: 600px;
      height: 90vh;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .chat-header {
      padding: 1rem 1.5rem;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat-header h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 600;
    }

    .reset-btn {
      background-color: transparent;
      color: var(--danger);
      border: 1px solid var(--danger);
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .reset-btn:hover {
      background-color: var(--danger);
      color: white;
    }

    #chat-box {
      flex: 1;
      padding: 1.5rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .message {
      max-width: 80%;
      padding: 0.75rem 1rem;
      border-radius: 12px;
      font-size: 0.95rem;
      white-space: pre-wrap;
    }

    .user-message {
      background-color: var(--user-bubble);
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .model-message {
      background-color: var(--model-bubble);
      color: var(--text);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
      border: 1px solid var(--border);
    }

    .input-area {
      padding: 1rem;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 0.5rem;
    }

    input[type="text"] {
      flex: 1;
      padding: 0.75rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-family: inherit;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .send-btn {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 0 1.5rem;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .send-btn:hover {
      background-color: var(--primary-hover);
    }

    .send-btn:disabled {
      background-color: #9ca3af;
      cursor: not-allowed;
    }
    
    .typing-indicator {
      color: #6b7280;
      font-size: 0.9rem;
      font-style: italic;
      align-self: flex-start;
      display: none;
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <div class="chat-header">
      <h1>Gemini Chat</h1>
      <button class="reset-btn" onclick="resetChat()">Reset Chat</button>
    </div>
    
    <div id="chat-box"></div>
    <div id="typing" class="typing-indicator" style="padding: 0 1.5rem 1rem;">Gemini is typing...</div>

    <div class="input-area">
      <input type="text" id="prompt" placeholder="Type your message..." onkeypress="handleEnter(event)">
      <button id="submitBtn" class="send-btn" onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    // Combine the split API keys into one variable
    const API_KEY1 = "AIzaSyCVFmaRcRPgs";
    const API_KEY2 = "-bpL08RRhA6V3ST5OFCzIk";
    const API_KEY = API_KEY1 + API_KEY2;
    const STORAGE_KEY = "gemini_chat_history";
    
    let conversationHistory = [];

    window.onload = function() {
      loadHistory();
    };

    function loadHistory() {
      const saved = localStorage.getItem(STORAGE_KEY);
      const chatBox = document.getElementById('chat-box');
      chatBox.innerHTML = '';

      if (saved) {
        try {
          conversationHistory = JSON.parse(saved);
          conversationHistory.forEach(msg => {
            const sender = msg.role === 'user' ? 'user' : 'model';
            appendMessage(sender, msg.parts[0].text);
          });
        } catch (e) {
          console.error("Failed to parse saved chat history:", e);
          resetChat();
        }
      } else {
        appendMessage('model', "Hi there! How can I help you today?");
      }
    }

    function saveHistory() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(conversationHistory));
    }

    function resetChat() {
      if (confirm("Are you sure you want to clear your chat history?")) {
        conversationHistory = [];
        localStorage.removeItem(STORAGE_KEY);
        loadHistory();
      }
    }

    function handleEnter(event) {
      if (event.key === 'Enter') {
        sendMessage();
      }
    }

    function appendMessage(sender, text) {
      const chatBox = document.getElementById('chat-box');
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${sender}-message`;
      msgDiv.innerText = text;
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function sendMessage() {
      const promptInput = document.getElementById('prompt');
      const text = promptInput.value.trim();
      const btn = document.getElementById('submitBtn');
      const typingIndicator = document.getElementById('typing');

      if (!text) return;
      
      // Update validation check to evaluate the combined key
      if (!API_KEY) {
        alert("Please add your API key to the script.");
        return;
      }

      appendMessage('user', text);
      promptInput.value = '';
      
      conversationHistory.push({
        role: "user",
        parts: [{ text: text }]
      });
      saveHistory();

      btn.disabled = true;
      typingIndicator.style.display = 'block';
      const chatBox = document.getElementById('chat-box');
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        // Now accurately uses the combined API_KEY variable
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key=${API_KEY}`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            contents: conversationHistory
          })
        });

        const data = await response.json();
        
        if (!response.ok) {
          throw new Error(data.error?.message || 'API request failed');
        }

        const generatedText = data.candidates[0].content.parts[0].text;
        
        appendMessage('model', generatedText);
        conversationHistory.push({
          role: "model",
          parts: [{ text: generatedText }]
        });
        saveHistory();

      } catch (error) {
        appendMessage('model', `Error: ${error.message}`);
        conversationHistory.pop(); 
        saveHistory();
      } finally {
        btn.disabled = false;
        typingIndicator.style.display = 'none';
        promptInput.focus();
      }
    }
  </script>
</body>
</html>
